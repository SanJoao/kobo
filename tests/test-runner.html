<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koby Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-value.passed { color: #28a745; }
        .stat-value.failed { color: #dc3545; }
        .stat-value.skipped { color: #ffc107; }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4A90E2;
            color: white;
        }

        .btn-primary:hover {
            background: #357ABD;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .test-results {
            margin-top: 20px;
        }

        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .suite-header {
            background: #f8f9fa;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suite-header:hover {
            background: #e9ecef;
        }

        .suite-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .suite-stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
        }

        .test-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .test-suite.expanded .test-list {
            max-height: 2000px;
        }

        .test-item {
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-name {
            flex: 1;
        }

        .test-status {
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-passed {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-skipped {
            background: #fff3cd;
            color: #856404;
        }

        .status-running {
            background: #d1ecf1;
            color: #0c5460;
        }

        .test-error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 4px;
        }

        .duration {
            color: #666;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4A90E2, #357ABD);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Koby Test Suite</h1>
        <p>Automated testing for reliability and quality assurance</p>

        <div class="summary">
            <div class="stat-card">
                <div class="stat-value" id="total-tests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value passed" id="passed-tests">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value failed" id="failed-tests">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value skipped" id="skipped-tests">0</div>
                <div class="stat-label">Skipped</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-bar" style="width: 0%">0%</div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="run-all-btn">Run All Tests</button>
            <button class="btn-secondary" id="run-unit-btn">Run Unit Tests</button>
            <button class="btn-secondary" id="run-integration-btn">Run Integration Tests</button>
            <button class="btn-secondary" id="clear-btn">Clear Results</button>
        </div>

        <div class="test-results" id="test-results"></div>
    </div>

    <script type="module">
        import { TestRunner } from './test-framework.js';
        import { unitTests } from './unit-tests.js';
        import { integrationTests } from './integration-tests.js';

        const runner = new TestRunner();

        // Register test suites
        runner.registerSuite('Unit Tests', unitTests);
        runner.registerSuite('Integration Tests', integrationTests);

        // Event listeners
        document.getElementById('run-all-btn').addEventListener('click', async () => {
            await runner.runAll();
            displayResults();
        });

        document.getElementById('run-unit-btn').addEventListener('click', async () => {
            await runner.runSuite('Unit Tests');
            displayResults();
        });

        document.getElementById('run-integration-btn').addEventListener('click', async () => {
            await runner.runSuite('Integration Tests');
            displayResults();
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            runner.clear();
            displayResults();
        });

        function displayResults() {
            const results = runner.getResults();

            // Update summary
            document.getElementById('total-tests').textContent = results.total;
            document.getElementById('passed-tests').textContent = results.passed;
            document.getElementById('failed-tests').textContent = results.failed;
            document.getElementById('skipped-tests').textContent = results.skipped;

            // Update progress bar
            const progressPercent = results.total > 0
                ? Math.round((results.passed / results.total) * 100)
                : 0;
            document.getElementById('progress-bar').style.width = progressPercent + '%';
            document.getElementById('progress-bar').textContent = progressPercent + '%';

            // Display test suites
            const container = document.getElementById('test-results');
            container.innerHTML = '';

            Object.entries(results.suites).forEach(([suiteName, suiteResults]) => {
                const suiteEl = createSuiteElement(suiteName, suiteResults);
                container.appendChild(suiteEl);
            });
        }

        function createSuiteElement(suiteName, suiteResults) {
            const div = document.createElement('div');
            div.className = 'test-suite';

            const passed = suiteResults.filter(t => t.status === 'passed').length;
            const failed = suiteResults.filter(t => t.status === 'failed').length;
            const skipped = suiteResults.filter(t => t.status === 'skipped').length;

            div.innerHTML = `
                <div class="suite-header">
                    <div class="suite-title">${suiteName}</div>
                    <div class="suite-stats">
                        <span style="color: #28a745">✓ ${passed}</span>
                        <span style="color: #dc3545">✗ ${failed}</span>
                        <span style="color: #ffc107">⊘ ${skipped}</span>
                    </div>
                </div>
                <div class="test-list">
                    ${suiteResults.map(test => createTestElement(test)).join('')}
                </div>
            `;

            div.querySelector('.suite-header').addEventListener('click', () => {
                div.classList.toggle('expanded');
            });

            return div;
        }

        function createTestElement(test) {
            const statusClass = `status-${test.status}`;
            const icon = {
                passed: '✓',
                failed: '✗',
                skipped: '⊘',
                running: '↻'
            }[test.status];

            return `
                <div class="test-item">
                    <div class="test-name">
                        ${test.name}
                        ${test.duration ? `<span class="duration">(${test.duration}ms)</span>` : ''}
                        ${test.error ? `<div class="test-error">${test.error}</div>` : ''}
                    </div>
                    <div class="test-status ${statusClass}">${icon} ${test.status.toUpperCase()}</div>
                </div>
            `;
        }

        // Initial display
        displayResults();
    </script>
</body>
</html>
