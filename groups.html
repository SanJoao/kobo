<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Groups - Koby</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header id="header" class="header"></header>

    <main class="groups-page">
        <div class="groups-container">
            <!-- Tab Navigation -->
            <div class="groups-tabs">
                <button class="groups-tab active" id="browse-tab" onclick="switchTab('browse')">
                    <i class="fas fa-compass"></i>
                    Browse Groups
                </button>
                <button class="groups-tab" id="my-groups-tab" onclick="switchTab('my-groups')">
                    <i class="fas fa-users"></i>
                    My Groups
                </button>
                <button class="btn-create-group" onclick="showCreateGroupModal()">
                    <i class="fas fa-plus"></i>
                    Create Group
                </button>
            </div>

            <!-- Search Bar -->
            <div class="groups-search" id="groups-search">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search groups by name, book, or topic...">
                    <button class="btn-search" onclick="searchGroups()">Search</button>
                </div>
            </div>

            <!-- Browse Groups Tab -->
            <div class="groups-content" id="browse-content">
                <div class="groups-grid" id="groups-grid">
                    <div class="groups-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading groups...</p>
                    </div>
                </div>

                <div class="groups-load-more" id="load-more-container" style="display: none;">
                    <button class="btn-load-more" onclick="loadMoreGroups()">
                        Load More Groups
                    </button>
                </div>
            </div>

            <!-- My Groups Tab -->
            <div class="groups-content" id="my-groups-content" style="display: none;">
                <div class="groups-grid" id="my-groups-grid">
                    <div class="groups-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading your groups...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Group Modal -->
    <div id="create-group-modal" class="modal" style="display: none;">
        <div class="modal-content group-modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-users"></i> Create Reading Group</h2>
                <span class="close" onclick="closeCreateGroupModal()">&times;</span>
            </div>

            <form id="create-group-form" onsubmit="handleCreateGroup(event)">
                <div class="form-group">
                    <label for="group-name">
                        Group Name <span class="required">*</span>
                    </label>
                    <input type="text" id="group-name" required maxlength="100"
                           placeholder="e.g., Sci-Fi Book Club">
                    <div class="char-counter">
                        <span id="name-count">0</span>/100
                    </div>
                </div>

                <div class="form-group">
                    <label for="group-description">Description</label>
                    <textarea id="group-description" rows="4" maxlength="1000"
                              placeholder="What's this group about?"></textarea>
                    <div class="char-counter">
                        <span id="description-count">0</span>/1000
                    </div>
                </div>

                <div class="form-group">
                    <label for="group-book">Focused on a specific book? (Optional)</label>
                    <input type="text" id="group-book" placeholder="Book title">
                    <input type="hidden" id="group-book-id">
                </div>

                <div class="form-group">
                    <label for="group-tags">Tags (comma-separated)</label>
                    <input type="text" id="group-tags" placeholder="e.g., sci-fi, fantasy, classics">
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="group-private">
                        <span>Make this a private group</span>
                    </label>
                    <p class="form-help">Private groups don't appear in public browse and require an invite link</p>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeCreateGroupModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i>
                        Create Group
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Group Detail Modal -->
    <div id="group-detail-modal" class="modal" style="display: none;">
        <div class="modal-content group-detail-modal-content">
            <span class="close" onclick="closeGroupDetailModal()">&times;</span>
            <div id="group-detail-content">
                <!-- Group details will be inserted here -->
            </div>
        </div>
    </div>

    <script type="module" src="/firebase-config.js"></script>
    <script type="module" src="/group-manager.js"></script>
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const auth = getAuth();
        let currentUser = null;
        let currentTab = 'browse';
        let isSearching = false;

        // Wait for auth state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadBrowseGroups();
            } else {
                window.location.href = '/login.html';
            }
        });

        // Load header
        fetch('/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        // Switch tabs
        window.switchTab = async function(tab) {
            currentTab = tab;

            // Update tab buttons
            document.querySelectorAll('.groups-tab').forEach(btn => {
                btn.classList.remove('active');
            });

            if (tab === 'browse') {
                document.getElementById('browse-tab').classList.add('active');
                document.getElementById('browse-content').style.display = 'block';
                document.getElementById('my-groups-content').style.display = 'none';
                document.getElementById('groups-search').style.display = 'block';

                if (!isSearching) {
                    await loadBrowseGroups();
                }
            } else if (tab === 'my-groups') {
                document.getElementById('my-groups-tab').classList.add('active');
                document.getElementById('browse-content').style.display = 'none';
                document.getElementById('my-groups-content').style.display = 'block';
                document.getElementById('groups-search').style.display = 'none';

                await loadMyGroups();
            }
        };

        // Load browse groups
        async function loadBrowseGroups() {
            const gridContainer = document.getElementById('groups-grid');
            gridContainer.innerHTML = `
                <div class="groups-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading groups...</p>
                </div>
            `;

            const groups = await window.groupManager.loadPublicGroups(20);
            renderGroups(groups, gridContainer);

            // Show/hide load more button
            const loadMoreContainer = document.getElementById('load-more-container');
            if (window.groupManager.hasMore) {
                loadMoreContainer.style.display = 'block';
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }

        // Load more groups
        window.loadMoreGroups = async function() {
            const btn = document.querySelector('.btn-load-more');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';

            const moreGroups = await window.groupManager.loadMorePublicGroups(20);

            if (moreGroups.length > 0) {
                const gridContainer = document.getElementById('groups-grid');
                const currentHTML = gridContainer.innerHTML;
                gridContainer.innerHTML = currentHTML + renderGroupsHTML(moreGroups);
            }

            if (!window.groupManager.hasMore) {
                document.getElementById('load-more-container').style.display = 'none';
            }

            btn.disabled = false;
            btn.innerHTML = 'Load More Groups';
        };

        // Load my groups
        async function loadMyGroups() {
            if (!currentUser) return;

            const gridContainer = document.getElementById('my-groups-grid');
            gridContainer.innerHTML = `
                <div class="groups-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading your groups...</p>
                </div>
            `;

            const groups = await window.groupManager.loadMyGroups(currentUser.uid);
            renderGroups(groups, gridContainer);
        }

        // Search groups
        window.searchGroups = async function() {
            const searchInput = document.getElementById('search-input');
            const searchTerm = searchInput.value.trim();

            if (!searchTerm) {
                isSearching = false;
                await loadBrowseGroups();
                return;
            }

            isSearching = true;

            const gridContainer = document.getElementById('groups-grid');
            gridContainer.innerHTML = `
                <div class="groups-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Searching...</p>
                </div>
            `;

            const groups = await window.groupManager.searchGroups(searchTerm, 20);
            renderGroups(groups, gridContainer);
            document.getElementById('load-more-container').style.display = 'none';
        };

        // Enter key for search
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        searchGroups();
                    }
                });
            }
        });

        // Render groups
        function renderGroups(groups, container) {
            if (groups.length === 0) {
                container.innerHTML = `
                    <div class="groups-empty">
                        <i class="fas fa-users-slash"></i>
                        <p>No groups found</p>
                        <p class="groups-empty-hint">
                            ${currentTab === 'my-groups'
                                ? 'Join or create a group to get started!'
                                : 'Try a different search or create a new group'}
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = renderGroupsHTML(groups);
        }

        // Render groups HTML
        function renderGroupsHTML(groups) {
            let html = '';

            groups.forEach(group => {
                const tagHTML = group.tags && group.tags.length > 0
                    ? group.tags.slice(0, 3).map(tag =>
                        `<span class="group-tag">${escapeHtml(tag)}</span>`
                    ).join('')
                    : '';

                const roleHTML = group.myRole
                    ? `<span class="group-role group-role-${group.myRole}">${group.myRole}</span>`
                    : '';

                html += `
                    <div class="group-card" onclick="viewGroup('${group.id}')">
                        <div class="group-card-header">
                            <h3 class="group-card-title">
                                ${group.isPrivate ? '<i class="fas fa-lock"></i>' : ''}
                                ${escapeHtml(group.name)}
                            </h3>
                            ${roleHTML}
                        </div>

                        ${group.bookTitle ? `
                            <div class="group-book">
                                <i class="fas fa-book"></i>
                                ${escapeHtml(group.bookTitle)}
                            </div>
                        ` : ''}

                        <p class="group-card-description">
                            ${escapeHtml(group.description || 'No description provided.')}
                        </p>

                        ${tagHTML ? `<div class="group-tags">${tagHTML}</div>` : ''}

                        <div class="group-card-footer">
                            <div class="group-stats">
                                <span>
                                    <i class="fas fa-users"></i>
                                    ${group.memberCount} ${group.memberCount === 1 ? 'member' : 'members'}
                                </span>
                                <span>
                                    <i class="fas fa-comment"></i>
                                    ${group.postCount} ${group.postCount === 1 ? 'post' : 'posts'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        // View group details
        window.viewGroup = async function(groupId) {
            const modal = document.getElementById('group-detail-modal');
            const content = document.getElementById('group-detail-content');

            content.innerHTML = `
                <div class="groups-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading group...</p>
                </div>
            `;

            modal.style.display = 'block';

            const group = await window.groupManager.getGroup(groupId);
            if (!group) {
                content.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Group not found</p>
                    </div>
                `;
                return;
            }

            const isMember = await window.groupManager.isMember(groupId, currentUser.uid);
            const role = isMember ? await window.groupManager.getMemberRole(groupId, currentUser.uid) : null;

            content.innerHTML = renderGroupDetail(group, isMember, role);

            // Load posts if member
            if (isMember) {
                loadGroupPosts(groupId);
            }
        };

        // Render group detail
        function renderGroupDetail(group, isMember, role) {
            const tagHTML = group.tags && group.tags.length > 0
                ? group.tags.map(tag => `<span class="group-tag">${escapeHtml(tag)}</span>`).join('')
                : '';

            let actionButtons = '';
            if (isMember) {
                if (role === 'admin') {
                    actionButtons = `
                        <button class="btn-primary" onclick="showNewPostForm('${group.id}')">
                            <i class="fas fa-pen"></i> New Post
                        </button>
                        <button class="btn-secondary" onclick="editGroup('${group.id}')">
                            <i class="fas fa-edit"></i> Edit Group
                        </button>
                        <button class="btn-danger" onclick="confirmDeleteGroup('${group.id}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    `;
                } else {
                    actionButtons = `
                        <button class="btn-primary" onclick="showNewPostForm('${group.id}')">
                            <i class="fas fa-pen"></i> New Post
                        </button>
                        <button class="btn-secondary" onclick="confirmLeaveGroup('${group.id}')">
                            <i class="fas fa-sign-out-alt"></i> Leave Group
                        </button>
                    `;
                }
            } else {
                actionButtons = `
                    <button class="btn-primary" onclick="joinGroup('${group.id}')">
                        <i class="fas fa-user-plus"></i> Join Group
                    </button>
                `;
            }

            return `
                <div class="group-detail">
                    <div class="group-detail-header">
                        <h2>
                            ${group.isPrivate ? '<i class="fas fa-lock"></i>' : ''}
                            ${escapeHtml(group.name)}
                        </h2>
                        <div class="group-detail-actions">
                            ${actionButtons}
                        </div>
                    </div>

                    ${group.bookTitle ? `
                        <div class="group-book-info">
                            <i class="fas fa-book"></i>
                            <strong>Reading:</strong> ${escapeHtml(group.bookTitle)}
                        </div>
                    ` : ''}

                    <p class="group-detail-description">
                        ${escapeHtml(group.description || 'No description provided.')}
                    </p>

                    ${tagHTML ? `<div class="group-tags">${tagHTML}</div>` : ''}

                    <div class="group-detail-stats">
                        <div class="stat">
                            <i class="fas fa-users"></i>
                            <span>${group.memberCount} ${group.memberCount === 1 ? 'member' : 'members'}</span>
                        </div>
                        <div class="stat">
                            <i class="fas fa-comment"></i>
                            <span>${group.postCount} ${group.postCount === 1 ? 'post' : 'posts'}</span>
                        </div>
                        <div class="stat">
                            <i class="fas fa-calendar"></i>
                            <span>Created ${formatDate(group.createdAt)}</span>
                        </div>
                    </div>

                    ${isMember ? `
                        <div class="group-posts-section" id="group-posts-section">
                            <h3><i class="fas fa-comments"></i> Discussions</h3>
                            <div id="group-posts-list">
                                <div class="groups-loading">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Loading discussions...</p>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="group-join-prompt">
                            <p><i class="fas fa-lock"></i> Join this group to view and participate in discussions</p>
                        </div>
                    `}
                </div>
            `;
        }

        // Load group posts
        async function loadGroupPosts(groupId) {
            const postsContainer = document.getElementById('group-posts-list');

            const posts = await window.groupManager.loadPosts(groupId, 20);

            if (posts.length === 0) {
                postsContainer.innerHTML = `
                    <div class="posts-empty">
                        <i class="fas fa-comment-slash"></i>
                        <p>No discussions yet</p>
                        <p class="posts-empty-hint">Be the first to start a discussion!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            posts.forEach(post => {
                html += `
                    <div class="group-post">
                        <div class="post-header">
                            <img src="${post.authorPhotoURL || '/assets/default-avatar.png'}"
                                 alt="${post.authorName}"
                                 class="post-author-avatar">
                            <div class="post-author-info">
                                <strong>${escapeHtml(post.authorName)}</strong>
                                <span class="post-time">${formatTimeAgo(post.createdAt)}</span>
                            </div>
                        </div>
                        <h4 class="post-title">${escapeHtml(post.title)}</h4>
                        <p class="post-content">${escapeHtml(post.content)}</p>
                        <div class="post-footer">
                            <span><i class="fas fa-comment"></i> ${post.commentCount}</span>
                            <span><i class="fas fa-heart"></i> ${post.likeCount}</span>
                        </div>
                    </div>
                `;
            });

            postsContainer.innerHTML = html;
        }

        // Join group
        window.joinGroup = async function(groupId) {
            const result = await window.groupManager.joinGroup(groupId);

            if (result.success) {
                alert('Successfully joined the group!');
                viewGroup(groupId); // Refresh
            } else {
                alert('Failed to join group: ' + (result.error || 'Unknown error'));
            }
        };

        // Leave group
        window.confirmLeaveGroup = async function(groupId) {
            if (!confirm('Are you sure you want to leave this group?')) return;

            const result = await window.groupManager.leaveGroup(groupId);

            if (result.success) {
                alert('Successfully left the group');
                closeGroupDetailModal();
                if (currentTab === 'my-groups') {
                    loadMyGroups();
                } else {
                    loadBrowseGroups();
                }
            } else {
                alert('Failed to leave group: ' + (result.error || 'Unknown error'));
            }
        };

        // Delete group
        window.confirmDeleteGroup = async function(groupId) {
            if (!confirm('Are you sure you want to delete this group? This action cannot be undone.')) return;

            const result = await window.groupManager.deleteGroup(groupId);

            if (result.success) {
                alert('Group deleted successfully');
                closeGroupDetailModal();
                if (currentTab === 'my-groups') {
                    loadMyGroups();
                } else {
                    loadBrowseGroups();
                }
            } else {
                alert('Failed to delete group: ' + (result.error || 'Unknown error'));
            }
        };

        // Show create group modal
        window.showCreateGroupModal = function() {
            if (!currentUser) {
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('create-group-modal').style.display = 'block';

            // Setup character counters
            const nameInput = document.getElementById('group-name');
            const descInput = document.getElementById('group-description');
            const nameCount = document.getElementById('name-count');
            const descCount = document.getElementById('description-count');

            nameInput.value = '';
            descInput.value = '';
            nameCount.textContent = '0';
            descCount.textContent = '0';

            nameInput.addEventListener('input', (e) => {
                nameCount.textContent = e.target.value.length;
            });

            descInput.addEventListener('input', (e) => {
                descCount.textContent = e.target.value.length;
            });
        };

        // Close create group modal
        window.closeCreateGroupModal = function() {
            document.getElementById('create-group-modal').style.display = 'none';
        };

        // Close group detail modal
        window.closeGroupDetailModal = function() {
            document.getElementById('group-detail-modal').style.display = 'none';
        };

        // Handle create group
        window.handleCreateGroup = async function(event) {
            event.preventDefault();

            const name = document.getElementById('group-name').value.trim();
            const description = document.getElementById('group-description').value.trim();
            const bookTitle = document.getElementById('group-book').value.trim();
            const bookId = document.getElementById('group-book-id').value || null;
            const isPrivate = document.getElementById('group-private').checked;
            const tagsInput = document.getElementById('group-tags').value.trim();
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

            const result = await window.groupManager.createGroup(
                name,
                description,
                bookId,
                bookTitle || null,
                isPrivate,
                tags
            );

            if (result.success) {
                alert('Group created successfully!');
                closeCreateGroupModal();

                // Switch to my groups tab and reload
                switchTab('my-groups');
            } else {
                alert('Failed to create group: ' + (result.error || 'Unknown error'));
            }
        };

        // Show new post form (placeholder for now)
        window.showNewPostForm = function(groupId) {
            const title = prompt('Post title:');
            if (!title) return;

            const content = prompt('Post content:');
            if (!content) return;

            createGroupPost(groupId, title, content);
        };

        // Create group post
        async function createGroupPost(groupId, title, content) {
            const result = await window.groupManager.createPost(groupId, title, content);

            if (result.success) {
                alert('Post created successfully!');
                viewGroup(groupId); // Refresh
            } else {
                alert('Failed to create post: ' + (result.error || 'Unknown error'));
            }
        }

        // Helper functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function formatTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffSecs / 60);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffSecs < 60) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 30) return `${diffDays}d ago`;
            return formatDate(date);
        }
    </script>
</body>
</html>
